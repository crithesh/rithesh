<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End Trip</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .end-trip-box {
            width: 590px;
            background: white;
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .trip-icon {
            font-size: 35px;
            color: #1764df;
        }

        .title {
            font-size: 30px;
            font-weight: 700;
            color: #142a52;
        }

        .close {
            font-size: 38px;
            color: #142a52;
            cursor: pointer;
        }

        /* SECTION */
        .section {
            margin-bottom: 25px;
        }

        .label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #142a52;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .icon {
            width: 27px;
            font-size: 24px;
            text-align: center;
        }

        /* INPUT */
        .input-box {
            width: 100%;
            height: 60px;
            background: #f5f8fc;
            border: 1px solid #d7e1ef;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 22px;
            color: #142a52;
            font-size: 17px;
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            width: 50%;
            height: 60px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel {
            background: white;
            border: 1px solid #b8c6da;
            color: #142a52;
        }

        .end {
            background: #2867e8;
            border: none;
            color: white;
        }

        .cancel:hover {
            background: #f5f7fa;
        }

        .end:hover {
            background: #1d58d1;
        }

        @media (max-width: 650px) {

            .end-trip-box {
                width: 92%;
                padding: 24px;
            }

            .title {
                font-size: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="end-trip-box">

        <!-- HEADER -->
        <div class="header">

            <div class="title-section">

                <div class="trip-icon">
                    ⦿
                </div>

                <div class="title">
                    End Trip
                </div>

            </div>

            <div class="close" onclick="goToDashboard()">
                ×
            </div>

        </div>


        <!-- START TIME -->
        <div class="section">

            <div class="label">
                <span class="icon">◷</span>
                <span>Start Time</span>
            </div>

            <div class="input-box">
                ◷ &nbsp;&nbsp; 07:30 AM
            </div>

        </div>


        <!-- END TIME -->
        <div class="section">

            <div class="label">
                <span class="icon">◷</span>
                <span>End Time</span>
            </div>

            <div class="input-box">
                ◷ &nbsp;&nbsp; 09:30 AM
            </div>

        </div>


        <!-- DATE - AFTER END TIME -->
        <div class="section">

            <div class="label">
                <span class="icon">▣</span>
                <span>Date</span>
            </div>

            <div class="input-box">
                ▣ &nbsp;&nbsp; Today, 09 Sep 2025
            </div>

        </div>


        <!-- BUTTONS -->
        <div class="buttons">

            <button class="cancel" onclick="goToDashboard()">
                Cancel
            </button>

            <button class="end" onclick="confirmEndTrip()">
                ✓ &nbsp; End Trip
            </button>

        </div>

    </div>

    <script>
        function goToDashboard() {
            window.location.href = "02_driver_dashboard.html";
        }

        function confirmEndTrip() {
            // Tells the dashboard to actually stop the trip timer.
            window.location.href = "02_driver_dashboard.html?action=end";
        }
    </script>

</body>
</html>
