<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Route</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            padding: 25px;
            padding-bottom: 100px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #222;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            cursor: pointer;
        }

        .add-driver-btn {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .add-driver-btn:hover {
            background: #256628;
        }

        .new-btn {
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 600;
        }

        .new-btn:hover {
            background: #1565c0;
        }

        .logout-btn {
            background: #fff0ef;
            color: #c0392b;
            border: 1px solid #f1c5c1;
            border-radius: 7px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #ffe2df;
        }

        /* =========================
           ROUTE LIST
        ========================= */

        .route-list {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .route-card {
            background: white;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .route-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .route-name {
            font-size: 17px;
            font-weight: 700;
            color: #222;
        }

        .route-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .route-time {
            color: #1976d2;
            font-size: 14px;
            font-weight: 700;
        }

        /* =========================
           DELETE BUTTON
        ========================= */

        .delete-btn {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        .route-meta {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 50px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 74px;
            background: white;
            border-top: 1px solid #ddd;

            display: flex;
            justify-content: space-around;
            align-items: center;

            z-index: 100;
        }

        .nav-item {
            text-align: center;
            color: #777;
            font-size: 12px;
            cursor: pointer;
            min-width: 80px;
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .nav-item.active {
            color: #1976d2;
            font-weight: bold;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 15px;
                padding-bottom: 100px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header-right {
                width: 100%;
                flex-wrap: wrap;
            }

            .route-card-top {
                align-items: flex-start;
            }

            .route-right {
                gap: 8px;
            }

            .route-name {
                font-size: 15px;
            }
        }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <h1 class="title">
            Route
        </h1>

        <div class="header-right">

            <button
                class="add-driver-btn"
                onclick="goToAddDriver()">
                + Add Driver
            </button>

            <button
                class="new-btn"
                onclick="goToNewTrip()">
                + New
            </button>

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <!-- =========================
         ROUTE LIST
    ========================== -->

    <div id="message" class="message">
        Loading routes...
    </div>

    <div
        id="routeList"
        class="route-list">
    </div>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->

    <div class="bottom-nav">

        <div
            class="nav-item"
            onclick="goToDashboard()">

            <div class="nav-icon">
                ▦
            </div>

            Dashboard

        </div>


        <div
            class="nav-item active"
            onclick="goToRoute()">

            <div class="nav-icon">
                🚌
            </div>

            Route

        </div>


        <div
            class="nav-item"
            onclick="goToCalendar()">

            <div class="nav-icon">
                📅
            </div>

            Calendar

        </div>


        <div
            class="nav-item"
            onclick="goToAnalysis()">

            <div class="nav-icon">
                📊
            </div>

            Analysis

        </div>


        <div
            class="nav-item"
            onclick="goToProfile()">

            <div class="nav-icon">
                ●
            </div>

            Profile

        </div>

    </div>


    <script>

        /* =================================
           PAGE NAVIGATION
        ================================= */

        function goToAddDriver() {
            window.location.href = "09_add_driver.html";
        }


        function goToNewTrip() {
            window.location.href = "04_new_trip.html";
        }


        function goToDashboard() {
            window.location.href = "03_route.html";
        }


        function goToRoute() {
            window.location.href = "03_route.html";
        }


        function goToCalendar() {
            window.location.href = "05_calendar.html";
        }


        function goToAnalysis() {
            window.location.href = "10_dashboard_analysis.html";
        }


        function goToProfile() {
            window.location.href = "08_admin_profile.html";
        }


        function logout() {
            window.location.href = "00_opening.html";
        }


        /* =================================
           LOAD ROUTES
        ================================= */

        function loadRoutes() {

            const message =
                document.getElementById("message");

            const routeList =
                document.getElementById("routeList");


            message.style.display = "block";

            message.textContent =
                "Loading routes...";

            routeList.innerHTML = "";


            fetch(
                "http://127.0.0.1:5000/api/routes"
            )

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "Server error: " +
                        response.status
                    );
                }

                return response.json();

            })

            .then(function(data) {

                console.log(
                    "Routes received:",
                    data
                );


                if (
                    !data.success ||
                    !data.routes ||
                    data.routes.length === 0
                ) {

                    message.style.display =
                        "block";

                    message.textContent =
                        'No routes yet. Click "+ New" to create a route.';

                    return;
                }


                message.style.display =
                    "none";


                data.routes.forEach(
                    function(route) {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "route-card";


                        card.innerHTML = `

                            <div class="route-card-top">

                                <div class="route-name">
                                    ${escapeHtml(
                                        route.route_name
                                    )}
                                </div>

                                <div class="route-right">

                                    <div class="route-time">
                                        ${escapeHtml(
                                            route.scheduled_start_time
                                        )}
                                    </div>

                                    <button
                                        class="delete-btn"
                                        onclick="deleteRoute(${route.route_id})">
                                        Delete
                                    </button>

                                </div>

                            </div>


                            <div class="route-meta">

                                Driver:
                                ${escapeHtml(
                                    route.driver_name
                                )}

                                &nbsp; | &nbsp;

                                Vehicle:
                                ${escapeHtml(
                                    route.vehicle_number ||
                                    "Not set"
                                )}

                                &nbsp; | &nbsp;

                                Seats:
                                ${escapeHtml(
                                    route.actual_seating_number
                                )}

                            </div>

                        `;


                        routeList.appendChild(
                            card
                        );

                    }
                );

            })

            .catch(function(error) {

                console.error(
                    "LOAD ROUTES ERROR:",
                    error
                );


                message.style.display =
                    "block";


                message.textContent =
                    "Could not load routes. Is app.py running?";

            });

        }


        /* =================================
           DELETE ROUTE
        ================================= */

        function deleteRoute(routeId) {

            console.log(
                "Trying to delete route:",
                routeId
            );


            if (!routeId) {

                alert(
                    "Route ID is missing."
                );

                return;
            }


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this route?"
                );


            if (!confirmDelete) {
                return;
            }


            fetch(
                "http://127.0.0.1:5000/api/routes/" +
                routeId,
                {
                    method: "DELETE"
                }
            )


            .then(
                async function(response) {

                    const text =
                        await response.text();


                    console.log(
                        "Delete status:",
                        response.status
                    );


                    console.log(
                        "Delete response:",
                        text
                    );


                    let data;


                    try {

                        data =
                            JSON.parse(text);

                    } catch (error) {

                        throw new Error(
                            "Server returned an invalid response."
                        );
                    }


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Delete failed."
                        );
                    }


                    return data;

                }
            )


            .then(function(data) {

                console.log(
                    "Delete result:",
                    data
                );


                if (data.success) {

                    alert(
                        "Route deleted successfully."
                    );


                    loadRoutes();

                } else {

                    alert(
                        data.message ||
                        "Could not delete route."
                    );

                }

            })


            .catch(function(error) {

                console.error(
                    "DELETE ERROR:",
                    error
                );


                alert(
                    "Delete failed:\n\n" +
                    error.message
                );

            });

        }


        /* =================================
           HTML ESCAPE
        ================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =================================
           START PAGE
        ================================= */

        loadRoutes();

    </script>

</body>

</html>
